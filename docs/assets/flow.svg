<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-labelledby="t d"><title id="t">Where LASIK sits</title><desc id="d">A hardened release goes through LASIK, which proves, folds, decrypts and strips, and then an agent or REA reads the real logic.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs>
<rect width="1280" height="230" rx="12" fill="#0b1020"/>
<rect x="40" y="30" width="270" height="130" rx="10" fill="#111a33" stroke="#243049" stroke-width="1"/><text x="175.0" y="70" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edff" text-anchor="middle">Your release</text><text x="175.0" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">hardened by BLA:</text><text x="175.0" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">opaque predicates, XOR strings,</text><text x="175.0" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">decoys, padding, prompt bait</text>
<rect x="350" y="30" width="270" height="130" rx="10" fill="#111a33" stroke="#22d3ee" stroke-width="1.8"/><text x="485.0" y="70" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#22d3ee" text-anchor="middle">lasik heal</text><text x="485.0" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">prove, fold, decrypt, cut,</text><text x="485.0" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">strip, redact</text><text x="485.0" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">(never runs the target)</text>
<rect x="660" y="30" width="270" height="130" rx="10" fill="#111a33" stroke="#243049" stroke-width="1"/><text x="795.0" y="70" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edff" text-anchor="middle">Healed copy</text><text x="795.0" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">same behaviour,</text><text x="795.0" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">readable code,</text><text x="795.0" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">byte-identical if clean</text>
<rect x="970" y="30" width="270" height="130" rx="10" fill="#111a33" stroke="#243049" stroke-width="1"/><text x="1105.0" y="70" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edff" text-anchor="middle">Agent or REA</text><text x="1105.0" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">reads the real logic</text><text x="1105.0" y="114" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">through the CLI, a copy,</text><text x="1105.0" y="132" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">or the MCP tools</text>
<line x1="316" y1="95" x2="344" y2="95" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="626" y1="95" x2="654" y2="95" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="936" y1="95" x2="964" y2="95" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#a)"/>
<text x="640.0" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Static analysis only. No eval, no vm, no WebAssembly instantiation, no network.</text></svg>