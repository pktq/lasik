name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Benchmark for the release notes
        run: node dist/cli.js bench bench/bla-crackme > bench.md
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Benchmark on BLA's CrackMe corpus"
            echo
            cat bench.md
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for details."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "LASIK ${GITHUB_REF_NAME}" --notes-file notes.md
