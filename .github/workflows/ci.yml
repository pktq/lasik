name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20.x, 22.x, 24.x]
        include:
          - os: windows-latest
            node: 22.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Benchmark on BLA CrackMes
        run: node dist/cli.js bench bench/bla-crackme
      - name: Scan must flag the CrackMes as blinded (exit 3)
        shell: bash
        run: |
          set +e
          node dist/cli.js scan bench/bla-crackme --fail-on blinded > /dev/null
          code=$?
          echo "exit code: $code"
          test "$code" -eq 3
      - name: BLA coverage ledger is valid and docs are current
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/bla-coverage.mjs docs
          git diff --exit-code -- docs/coverage.md README.md docs/readme
      - name: Benchmark on real BLA 3.2.1 output (docs must match)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/bench-real.mjs --check
